name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout provider
      uses: actions/checkout@v4
      with:
        path: provider

    - name: Resolve IaC core ref
      id: core-ref
      shell: bash
      run: |
        candidate="${{ github.head_ref || github.ref_name }}"
        core_url="https://github.com/${{ github.repository_owner }}/iac-pipeline-api-plugin.git"
        if git ls-remote --exit-code --heads "$core_url" "$candidate" >/dev/null 2>&1; then
          echo "ref=$candidate" >> "$GITHUB_OUTPUT"
        else
          echo "ref=main" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout IaC Pipeline API
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/iac-pipeline-api-plugin
        ref: ${{ steps.core-ref.outputs.ref }}
        path: iac-pipeline-api-plugin

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Install IaC Pipeline API
      run: mvn -B -ntp install --file iac-pipeline-api-plugin/pom.xml

    - name: Build provider
      run: mvn -B -ntp package --file provider/pom.xml
